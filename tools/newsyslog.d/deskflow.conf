# newsyslog(8) rotation for the root-owned Deskflow logs written by launchd
# StandardOutPath/StandardErrorPath (no in-process rotation possible).
#
# Install (root, once per macOS seat; newsyslog runs from launchd every 30 min):
#   sudo install -m 644 -o root -g wheel tools/newsyslog.d/deskflow.conf /etc/newsyslog.d/deskflow.conf
#   sudo chmod 600 /var/log/deskflow-vhid-bridge.log   # existing file predates this mode
#   sudo newsyslog -nvv -f /etc/newsyslog.d/deskflow.conf   # dry run
#
# Rotate at 1 MB, keep 3 compressed generations (.0.bz2 .. .2.bz2). Neither
# process reopens its log (flag N: no signal): deskflow-prio is a fresh
# process every 30 s, so launchd reopens the path each run; the vhid-bridge
# holds its fd until the LoginWindow session ends (every login), so the
# rotated file receives its output until then.
#
# logfilename                        [owner:group]  mode  count  size  when  flags
/var/log/deskflow-prio.log           root:wheel     644   3      1024  *     JN
/var/log/deskflow-vhid-bridge.log    root:wheel     600   3      1024  *     JN
